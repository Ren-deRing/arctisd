# arctisd decides which Arctis input (Game/Chat/Media) each app uses.
# WirePlumber's per-app target memory is keyed by application.name and fights
# that (e.g. Discord and Chrome calls are both "WEBRTC VoiceEngine"), so turn it off.
stream.rules = [
  {
    matches = [
      { media.class = "Stream/Output/Audio", node.name = "!~arctis_.*" }
    ]
    actions = {
      update-props = {
        state.restore-target = false
      }
    }
  }
]
