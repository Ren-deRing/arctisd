# Game / Chat / Media virtual inputs, all mixed into the Arctis Nova 5X.
# arctisd only changes the Game and Chat volumes (headset ChatMix wheel).
context.modules = [
    { name = libpipewire-module-loopback
      args = {
          node.description = "Arctis Game"
          capture.props = {
              node.name = "arctis_game"
              media.class = "Audio/Sink"
              audio.position = [ FL FR ]
          }
          playback.props = {
              node.name = "arctis_game.out"
              target.object = "alsa_output.usb-SteelSeries_SteelSeries_Arctis_Nova_5X-00.analog-stereo"
              node.passive = true
              stream.dont-remix = true
          }
      }
    }
    { name = libpipewire-module-loopback
      args = {
          node.description = "Arctis Chat"
          capture.props = {
              node.name = "arctis_chat"
              media.class = "Audio/Sink"
              audio.position = [ FL FR ]
          }
          playback.props = {
              node.name = "arctis_chat.out"
              target.object = "alsa_output.usb-SteelSeries_SteelSeries_Arctis_Nova_5X-00.analog-stereo"
              node.passive = true
              stream.dont-remix = true
          }
      }
    }
    { name = libpipewire-module-loopback
      args = {
          node.description = "Arctis Media"
          capture.props = {
              node.name = "arctis_media"
              media.class = "Audio/Sink"
              audio.position = [ FL FR ]
          }
          playback.props = {
              node.name = "arctis_media.out"
              target.object = "alsa_output.usb-SteelSeries_SteelSeries_Arctis_Nova_5X-00.analog-stereo"
              node.passive = true
              stream.dont-remix = true
          }
      }
    }
]
